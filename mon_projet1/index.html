<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Galerie Photo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bienvenue sur ma galerie !</h1>
        <div class="galerie">
            <div class="photo-card">
                <div class="photo-container">
                    <img src="static/images/photo1.jpeg" alt="photo 1" class="ma-photo" onclick="ouvrirPleinEcran(0)">
                </div>
                <p class="photo-titre">Photo 1</p>
            </div>
            <div class="photo-card">
                <div class="photo-container">
                    <img src="static/images/photo2.jpeg" alt="photo 2" class="ma-photo" onclick="ouvrirPleinEcran(1)">
                </div>
                <p class="photo-titre">Photo 2</p>
            </div>
            <div class="photo-card">
                <div class="photo-container">
                    <img src="static/images/photo3.jpeg" alt="photo 3" class="ma-photo" onclick="ouvrirPleinEcran(2)">
                </div>
                <p class="photo-titre">Photo 3</p>
            </div>
            <div class="photo-card">
                <div class="photo-container">
                    <img src="static/images/photo4.jpeg" alt="photo 4" class="ma-photo" onclick="ouvrirPleinEcran(3)">
                </div>
                <p class="photo-titre">Photo 4</p>
            </div>
        </div>
        <p>Ceci est une galerie photo</p>
        <button id="monBouton">Cliquer-moi</button>
        <p id="message"></p>
        <div class="qr-section">
            <h3>📱 Scannez ce QR code</h3>
            <img src="static/images/qr_code.png" alt="QR Code" class="qr-display">
            <p class="qr-text">https://swhjidou.github.io/schoolqr.github.io/</p>
        </div>
    </div>
    <div id="modele" class="modele" onclick="fermerPleinEcran()">
        <span class="fermer">&times;</span>
        <img class="modele-contenu" id="imageModele">
        <div class="nav-gauche" onclick="event.stopPropagation(); photoPrecedente()">&#10094;</div>
        <div class="nav-droite" onclick="event.stopPropagation(); photoSuivante()">&#10095;</div>
    </div>
    <script>
        const photos = ["static/images/photo1.jpeg","static/images/photo2.jpeg","static/images/photo3.jpeg","static/images/photo4.jpeg"];
        let indexActuel = 0;
        const bouton = document.getElementById('monBouton');
        const message = document.getElementById("message");
        const modele = document.getElementById("modele");
        const imageModele = document.getElementById("imageModele");
        bouton.addEventListener('click', function(){
            message.innerHTML = "✨ Vous avez cliqué sur le bouton ! ✨";
            message.style.color = 'blue';
            setTimeout(() => message.innerHTML = "", 3000);
        });
        function ouvrirPleinEcran(index) { indexActuel = index; imageModele.src = photos[indexActuel]; modele.style.display = "flex"; }
        function fermerPleinEcran() { modele.style.display = "none"; }
        function photoSuivante() { indexActuel = (indexActuel + 1) % photos.length; imageModele.src = photos[indexActuel]; }
        function photoPrecedente() { indexActuel = (indexActuel - 1 + photos.length) % photos.length; imageModele.src = photos[indexActuel]; }
        document.addEventListener("keydown", function(event) {
            if (modele.style.display === "flex") {
                if (event.key === "ArrowRight") photoSuivante();
                else if (event.key === "ArrowLeft") photoPrecedente();
                else if (event.key === "Escape") fermerPleinEcran();
            }
        });
        let tempsRestant = 180;
        let compteurInterval;
        const compteurDiv = document.createElement("div");
        compteurDiv.id = "compteur";
        compteurDiv.innerHTML = `<div class="compteur-contenu"><span class="compteur-icone">⏱️</span><span class="compteur-temps" id="temps">03:00</span><span class="compteur-texte">Avant fermeture</span></div>`;
        document.body.appendChild(compteurDiv);
        function formaterTemps(secondes) { const minutes = Math.floor(secondes / 60); const secs = secondes % 60; return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`; }
        function mettreAJourCompteur() {
            const tempsElement = document.getElementById('temps');
            tempsElement.textContent = formaterTemps(tempsRestant);
            if (tempsRestant <= 30) { tempsElement.style.color = '#ff4444'; tempsElement.style.fontSize = '28px'; }
            else if (tempsRestant <= 60) { tempsElement.style.color = '#ffaa00'; tempsElement.style.fontSize = '24px'; }
            else { tempsElement.style.color = '#4caf50'; tempsElement.style.fontSize = '20px'; }
            if (tempsRestant <= 0) {
                clearInterval(compteurInterval);
                document.body.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);font-family:Arial,sans-serif;"><div style="background:white;padding:40px;border-radius:20px;text-align:center;"><h1>⏰ Session terminée ⏰</h1><p>Le temps imparti de 3 minutes est écoulé.</p><p>Actualisez la page pour recommencer</p></div></div>`;
            }
            tempsRestant--;
        }
        function resetTimer() { tempsRestant = 180; mettreAJourCompteur(); clearInterval(compteurInterval); compteurInterval = setInterval(mettreAJourCompteur, 1000); }
        resetTimer();
        document.addEventListener('mousemove', resetTimer);
        document.addEventListener('click', resetTimer);
        document.addEventListener('keydown', resetTimer);
    </script>
</body>
</html>
