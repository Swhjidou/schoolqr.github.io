<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vérification QR</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 30px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 20px;
    }

    .error {
      color: red;
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }

    .ok {
      color: green;
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
    }

    .info {
      color: #555;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Vérification du QR Code</h1>
    <div id="message"></div>
    <div id="imageContainer"></div>
  </div>

  <script>
    function getParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name);
    }

    function decodeBase64UrlSafe(str) {
      try {
        // Remettre le format base64 standard
        str = str.replace(/-/g, '+').replace(/_/g, '/');

        // Ajouter le padding si nécessaire
        while (str.length % 4) {
          str += '=';
        }

        return atob(str);
      } catch (e) {
        return null;
      }
    }

    const encodedUrl = getParam("url");
    const exp = parseInt(getParam("exp"));
    const token = getParam("token"); // optionnel ici

    const messageDiv = document.getElementById("message");
    const imageContainer = document.getElementById("imageContainer");

    if (!encodedUrl || !exp) {
      messageDiv.innerHTML = '<div class="error">❌ Paramètres invalides dans le QR code.</div>';
    } else {
      const now = Math.floor(Date.now() / 1000);

      if (now > exp) {
        messageDiv.innerHTML = '<div class="error">⛔ QR Code expiré !</div>';
      } else {
        const imageUrl = decodeBase64UrlSafe(encodedUrl);

        if (!imageUrl) {
          messageDiv.innerHTML = '<div class="error">❌ Impossible de décoder l’URL de l’image.</div>';
        } else {
          const reste = exp - now;

          messageDiv.innerHTML = `
            <div class="ok">✅ QR Code valide</div>
            <div class="info">Temps restant : ${reste} secondes</div>
          `;

          imageContainer.innerHTML = `<img src="${imageUrl}" alt="Photo affichée via QR Code" />`;
        }
      }
    }
  </script>
</body>
</html>
